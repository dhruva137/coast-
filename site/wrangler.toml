# COAST public landing — Cloudflare Pages
# Deploy from this directory:
#   npx wrangler pages deploy . --project-name=coast-landing
#
# Custom domain (configure in dashboard or via API):
#   coast.papertoanything.com → coast-landing.pages.dev
#
# Dashboard: Workers & Pages → coast-landing → Custom domains → Add domain

name = "coast-landing"
compatibility_date = "2024-09-01"

pages_build_output_dir = "."

# No build command — static HTML/CSS only.
# If using Git integration, set:
#   Build command: (none)
#   Build output directory: site
