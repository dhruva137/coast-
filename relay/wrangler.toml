# COAST pairing relay (Cloudflare Worker + KV)
#
# This is NOT the Pages landing. Pages has no persistent process and cannot
# hold mailboxes. Bind this Worker to coast.paper2anything.com (or a
# dedicated host) after creating the KV namespace.
#
#   npx wrangler kv namespace create MAILBOX
#   # paste id below, then:
#   npx wrangler deploy
#
# Not claimed deployed by this repo.

name = "coast-relay"
main = "worker.js"
compatibility_date = "2024-09-01"

# Replace with the id from `wrangler kv namespace create MAILBOX`.
# preview_id is optional for wrangler dev.
[[kv_namespaces]]
binding = "MAILBOX"
id = "00000000000000000000000000000000"
